[[rule]]
name = "the radar at a position is never written to the cache file"
file = "src/weather_mcp/weather.py"
find = '''^                return await self\._cache\.get_json\(NOWCAST, point\(where\), on_disk=not isinstance\(where, Here\)\)$'''
replace = '''return await self._cache.get_json(NOWCAST, point(where), on_disk=True)'''
