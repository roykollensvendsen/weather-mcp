[[rule]]
name = "a single step of speckle is not a change"
file = "src/weather_mcp/nowcast.py"
find = '''^    return next\(\(n for n in range\(start, last\) if wet\[start\] not in wet\[n : n \+ SETTLED\]\), None\)$'''
replace = '''return next((n for n in range(start, len(wet)) if wet[n] != wet[start]), None)'''
