# Every rule this project enforces, and the one line that carries it.
#
# A rule nothing catches is a rule nothing protects. `scripts/mutate.py` turns
# each of these off in turn and runs the suite; a rule whose removal breaks no
# test has no test. Add a test of your own that counts the rules in the source
# against the rows here, so this list cannot fall behind.
#
# `find` is a regular expression matching the single line to replace; `replace`
# is what replaces it, keeping the file valid. The line's own indentation is
# kept, so do not write indentation here.
#
# [[rule]]
# name = "what the rule says, in words"
# file = "src/weather_mcp/somewhere.py"
# find = 'if limit_exceeded:'
# replace = 'if False:'

[[rule]]
name = "the contact has no default"
file = "src/weather_mcp/config.py"
find = 'if not contact:'
replace = 'if False:'

[[rule]]
name = "home is rounded to two decimals"
file = "src/weather_mcp/config.py"
find = 'return round\(value, DECIMALS\)'
replace = 'return value'

[[rule]]
name = "nothing is asked again before it expires"
file = "src/weather_mcp/cache.py"
find = 'if kept is not None and now < kept.expires:'
replace = 'if False:'

[[rule]]
name = "a repeat after expiry asks with if modified since"
file = "src/weather_mcp/cache.py"
find = 'if kept is not None and kept.last_modified:'
replace = 'if False:'

[[rule]]
name = "a 429 answers from the cache"
file = "src/weather_mcp/cache.py"
find = 'if kept is None:'
replace = 'if True:'

[[rule]]
name = "a shared name asks which one"
file = "src/weather_mcp/places.py"
find = 'if len\(by_municipality\) > 1:'
replace = 'if False:'

[[rule]]
name = "a slowed answer says how old it is"
file = "src/weather_mcp/weather.py"
find = 'if answer.slowed:'
replace = 'if False:'

[[rule]]
name = "a 429 holds off every request until it ends"
file = "src/weather_mcp/cache.py"
find = 'if self._held_until is not None and now < self._held_until:'
replace = 'if False:'

[[rule]]
name = "a failure logs no coordinates"
file = "src/weather_mcp/server.py"
find = 'logging.getLogger\(__name__\).error\("weather_now failed: %s"'
replace = 'logging.getLogger(__name__).exception("weather_now failed")'

[[rule]]
name = "every answer comes within the deadline"
file = "src/weather_mcp/server.py"
find = 'return await asyncio.wait_for\(weather.now\(place\), answer_within\)'
replace = 'return await weather.now(place)'

[[rule]]
name = "a restart keeps what the cache held"
file = "src/weather_mcp/cache.py"
find = '^        self._load\(\)$'
replace = 'pass'

[[rule]]
name = "a hold off lasts at most an hour"
file = "src/weather_mcp/cache.py"
find = 'if until > now \+ LONGEST_HOLD_OFF:'
replace = 'if False:'

[[rule]]
name = "a failed save never stops an answer"
file = "src/weather_mcp/cache.py"
find = '^        except OSError as unsaved:$'
replace = 'except ZeroDivisionError as unsaved:'

[[rule]]
name = "places expired over a day ago are forgotten"
file = "src/weather_mcp/cache.py"
find = 'if now - k\.expires < FORGET_AFTER or key\.partition'
replace = 'if True'

[[rule]]
name = "an older open cache folder is made private"
file = "src/weather_mcp/cache.py"
find = 'folder\.chmod\(stat\.S_IMODE\(folder\.stat\(\)\.st_mode\) & 0o700\)'
replace = 'None'
